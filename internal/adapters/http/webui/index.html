<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>timetrack</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>⏱ timetrack</h1>
  <nav>
    <button data-tab="status" class="active">Status</button>
    <button data-tab="entries">Einträge</button>
    <button data-tab="absences">Abwesenheiten</button>
    <button data-tab="report">Bericht</button>
  </nav>
</header>

<main>
<section id="tab-status">
  <div class="card" id="status-card">
    <div id="status-state" class="state">–</div>
    <div id="status-detail"></div>
    <div class="actions">
      <input id="start-project" list="project-list" placeholder="Projekt(e), z.B. acme+intern">
      <datalist id="project-list"></datalist>
      <button id="btn-start" class="primary">Start</button>
      <button id="btn-switch">Wechseln</button>
      <button id="btn-pause">Pause</button>
      <button id="btn-resume">Weiter</button>
      <button id="btn-stop" class="danger">Stop</button>
    </div>
    <div id="status-warnings"></div>
  </div>
  <div class="card">
    <h2>Heute</h2>
    <div id="today-summary"></div>
  </div>
  <div class="card">
    <h2>Überstundensaldo</h2>
    <div id="saldo" class="big">–</div>
  </div>
</section>

<section id="tab-entries" hidden>
  <div class="card">
    <div class="rangebar">
      <label>Von <input type="date" id="entries-from"></label>
      <label>Bis <input type="date" id="entries-to"></label>
      <button id="entries-reload">Anzeigen</button>
      <button id="entry-new" class="primary">+ Eintrag</button>
    </div>
    <table id="entries-table">
      <thead><tr><th>Datum</th><th>Zeit</th><th>Dauer</th><th>Typ</th><th>Projekt</th><th>Notiz</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<section id="tab-absences" hidden>
  <div class="card">
    <div class="rangebar">
      <label>Jahr <input type="number" id="absences-year" style="width:6em"></label>
      <button id="absences-reload">Anzeigen</button>
    </div>
    <form id="absence-form" class="rangebar">
      <select id="absence-type">
        <option value="urlaub">Urlaub</option>
        <option value="krank">Krank</option>
        <option value="feiertag">Feiertag</option>
      </select>
      <label>Von <input type="date" id="absence-from" required></label>
      <label>Bis <input type="date" id="absence-to"></label>
      <label><input type="checkbox" id="absence-half"> halber Tag</label>
      <button class="primary">Eintragen</button>
    </form>
    <table id="absences-table">
      <thead><tr><th>Datum</th><th>Typ</th><th>Notiz</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <p id="vacation-count"></p>
  </div>
</section>

<section id="tab-report" hidden>
  <div class="card">
    <div class="rangebar">
      <button data-range="week">Woche</button>
      <button data-range="month">Monat</button>
      <button data-range="year">Jahr</button>
      <label>Von <input type="date" id="report-from"></label>
      <label>Bis <input type="date" id="report-to"></label>
      <button id="report-reload" class="primary">Anzeigen</button>
    </div>
    <div id="report-totals"></div>
    <table id="report-table">
      <thead><tr><th>Tag</th><th>Ist</th><th>Pause</th><th>Soll</th><th>Diff</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <h2>Projekte</h2>
    <div id="report-projects"></div>
  </div>
</section>
</main>

<dialog id="entry-dialog">
  <form id="entry-dialog-form" method="dialog">
    <h2 id="entry-dialog-title">Eintrag</h2>
    <label>Datum <input type="date" id="ed-date" required></label>
    <label>Von <input type="time" id="ed-from" required></label>
    <label>Bis <input type="time" id="ed-to" required></label>
    <label>Typ
      <select id="ed-kind">
        <option value="work">Arbeit</option>
        <option value="break">Pause</option>
      </select>
    </label>
    <label>Projekt <input id="ed-project" list="project-list"></label>
    <label>Notiz <input id="ed-note"></label>
    <div class="actions">
      <button value="cancel" formnovalidate>Abbrechen</button>
      <button value="save" class="primary">Speichern</button>
    </div>
  </form>
</dialog>

<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
